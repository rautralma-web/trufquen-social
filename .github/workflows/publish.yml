name: Publicar en Instagram

# Revisa cada 15 min y publica lo que esté vencido en content/calendario.json.
#
# Los minutos NO son redondos a propósito. GitHub documenta que los cron se
# retrasan bajo carga, y la carga se concentra en el minuto 0 de cada hora
# porque casi todo el mundo programa ahí. Corriendo en 3/18/33/48 caemos en
# horario de menos congestión y el disparo llega más puntual.
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Publicar un post concreto (ej. dia-2). Vacío = lo que toque.'
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # En los arranques manuales se comprueba todo antes de tocar nada.
      # Así una ejecución de prueba confirma que los secretos sirven,
      # sin publicar. En los automáticos se omite para no gastar llamadas.
      - name: Comprobar el sistema
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/verificar.mjs

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then
            node scripts/publish.mjs --id "${{ github.event.inputs.id }}"
          else
            node scripts/publish.mjs
          fi

      - name: Registrar lo publicado
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "trufquen-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/
            git commit -m "registro: publicación automática"
            git push
          fi
